<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="100円付箋">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#dde5e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1a1d" media="(prefers-color-scheme: dark)">
<title>100円付箋</title>
<style>
:root{
  --edge:46px; /* iOSが上端にかける自動ぼかしを避けるための余白 */
  --bg:#dde5e8; --panel:#f3f7f8; --ink:#1b2a2f; --sub:#5a6e75; --line:#c3d0d5;
  --brass:#c8922a; --brass-ink:#2d1d00; --red:#c4412b; --ok:#2f7d5b;
  --font:ui-rounded,"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --num:"Avenir Next Condensed","DIN Condensed","Arial Narrow",ui-rounded,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1a1d; --panel:#172629; --ink:#e4eef0; --sub:#8fa4ab; --line:#27393d; --brass:#e0aa45; --brass-ink:#241700; --red:#ee7058; --ok:#58c39a}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
body{overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
textarea{font:inherit;-webkit-user-select:text;user-select:text}
#app{position:fixed;inset:0}

/* ---------- 付箋(コイン) ---------- */
.stage{position:absolute;inset:0 0 calc(76px + env(safe-area-inset-bottom)) 0;padding:calc(env(safe-area-inset-top) + var(--edge) + 80px) 14px 6px;display:flex;align-items:center;justify-content:center;perspective:1400px;touch-action:pan-y}
.card{position:relative;width:min(100%,520px);height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.card.drag{transition:none}
.card .front{transition:visibility 0s linear .27s}
.card.flipped .front{visibility:hidden}
.card.drag .front{visibility:visible!important;transition:none}
.face{position:absolute;inset:0;border-radius:28px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.28),0 2px 0 rgba(255,255,255,.5) inset}
.front{background:radial-gradient(120% 90% at 30% 15%,#b08a2e 0%,#8a6a1e 55%,#5f4510 100%);color:#2b3942;display:flex;align-items:center;justify-content:center}
.coin{width:min(84%,52dvh);aspect-ratio:1;filter:drop-shadow(0 16px 20px rgba(30,15,0,.55))}
.coin svg{display:block;width:100%;height:100%}
.front .sub{position:absolute;bottom:30px;font-size:14px;color:rgba(255,238,190,.75);letter-spacing:.05em}
.back{transform:rotateY(180deg);background:#fbf6e4;color:#33290f;padding:26px 22px 22px;display:flex;flex-direction:column;gap:12px;
  background-image:repeating-linear-gradient(transparent 0 35px,rgba(120,100,40,.16) 35px 36px)}
.back .lbl{font-weight:800;font-size:12.5px;color:#7a6322;white-space:nowrap}
#zone{flex:1;min-height:0;display:flex}
#txt,#zone textarea{flex:1;width:100%;font-size:24px;line-height:36px;padding:0;border:0;background:transparent;color:#33290f;resize:none;outline:none}
#txt{white-space:pre-wrap;overflow:auto}
#txt.ph{color:#a89a68}
.tip{font-size:12.5px;line-height:1.5;color:#7a6a3a}

.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px 18px;font-weight:800;font-size:18px;cursor:pointer;background:var(--ink);color:var(--bg);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.brass{background:var(--brass);color:var(--brass-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:12px;width:auto;display:inline-block}

/* ---------- 本日のラウンド帯 ---------- */
#day{position:fixed;top:0;left:0;right:0;z-index:18;padding:calc(env(safe-area-inset-top) + var(--edge)) 14px 8px;background:var(--bg);isolation:isolate;-webkit-transform:translateZ(0);transform:translateZ(0)}
#day .r1{display:flex;align-items:center;gap:6px}
#day .btn.sm{padding:9px 11px}
#day .msg{margin-top:5px;min-height:18px;font-size:12.5px;font-weight:800;color:var(--sub);white-space:nowrap;overflow:hidden}
#day.live{background:linear-gradient(90deg,#ff3b2f,#ff8a00);color:#fff}
#day.live .dl,#day.live .dl b,#day.live .msg{color:#fff;text-shadow:0 1px 2px rgba(120,20,0,.35)}
#day.live .btn.brass{background:#fff;color:#c2300a}
#day.live .btn.ghost{color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.8) inset}
#day.rest{background:color-mix(in srgb,var(--sub) 16%,var(--bg))}
body.live::after{content:"";position:fixed;inset:0;border-radius:46px;box-shadow:inset 0 0 0 4px #ff5a1f;pointer-events:none;z-index:17}
#day .dl{flex:1;font-weight:800;font-size:13px;color:var(--sub)}
#day .dl b{font-family:var(--num);font-size:19px;color:var(--brass)}
/* ---------- ナビ ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
#nav button{flex:1;border:0;border-radius:16px;padding:13px 8px;font-weight:800;font-size:15px;background:var(--panel);box-shadow:0 0 0 1.5px var(--line) inset;cursor:pointer}
#nav button.on{background:var(--ink);color:var(--bg);box-shadow:none}
#nav b{font-family:var(--num);font-size:18px;margin-left:6px;color:var(--brass)}
#nav button.on b{color:var(--brass)}
#nav.hide{display:none}

/* ---------- 汎用ページ ---------- */
.page{position:absolute;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top) + var(--edge) + 86px) 18px calc(110px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;-webkit-overflow-scrolling:touch}
.page.nonav{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.page h2{margin:0 0 14px;font-size:22px}
.meta{color:var(--sub);font-size:14px;margin:10px 0 18px}
.stack{display:flex;flex-direction:column;gap:12px}

.mini{position:relative;height:40dvh;border-radius:24px;padding:22px;display:flex;flex-direction:column;
  background:radial-gradient(120% 90% at 30% 15%,#f6f8f9 0%,#d9dee2 45%,#aab3ba 100%);color:#2b3942;box-shadow:0 14px 30px rgba(0,0,0,.25);overflow:hidden}
.mini .amtline{display:flex;align-items:baseline;gap:4px;font-family:var(--num);font-weight:800}
.mini .amtline .n{font-size:64px;line-height:1}
.mini .amtline .y{font-size:22px;font-family:var(--font)}
.mini .ptxt{margin-top:10px;font-size:20px;line-height:1.45;font-weight:700;overflow:auto;white-space:pre-wrap;word-break:break-word}
.tear{position:relative;height:40dvh}
.tear .half{position:absolute;inset:0}
.tear .half .mini{height:100%}
.tear .l{clip-path:polygon(0 0,54% 0,47% 14%,55% 30%,46% 47%,54% 63%,47% 80%,52% 100%,0 100%);animation:tl .95s cubic-bezier(.5,0,.9,.5) forwards}
.tear .r{clip-path:polygon(54% 0,100% 0,100% 100%,52% 100%,47% 80%,54% 63%,46% 47%,55% 30%,47% 14%);animation:tr .95s cubic-bezier(.5,0,.9,.5) forwards}
@keyframes tl{to{transform:translate(-30vw,95dvh) rotate(-22deg);opacity:.2}}
@keyframes tr{to{transform:translate(30vw,100dvh) rotate(24deg);opacity:.2}}
.drop{animation:drop .7s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes drop{to{transform:translateY(62dvh) scale(.18) rotate(14deg);opacity:0}}

/* ---------- 実行中 ---------- */
.run{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + var(--edge) + 84px) 18px calc(18px + env(safe-area-inset-bottom));gap:14px;max-width:560px;margin:0 auto}
.run .mini{flex:none;height:auto;width:100%;aspect-ratio:85.6/54;padding:14px 18px}
.run .mini .ptxt{font-size:30px;line-height:1.35;margin-top:18px}
.run .mini .tiny{position:absolute;left:16px;top:10px;font-family:var(--num);font-weight:700;font-size:11px;opacity:.4}
.timer{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:800;font-size:64px;text-align:center;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.praise{margin:0 0 14px;padding:14px 16px;border-radius:16px;font-weight:800;font-size:17px;line-height:1.55;background:color-mix(in srgb,var(--brass) 18%,var(--panel));box-shadow:0 0 0 2px var(--brass) inset}
.hint{font-size:12px;text-align:center;color:var(--sub);opacity:.8}

/* ---------- 金額チップ ---------- */
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{border:0;border-radius:14px;padding:14px 0;font-family:var(--num);font-weight:800;font-size:22px;background:var(--panel);box-shadow:0 0 0 1.5px var(--line) inset;cursor:pointer}
.chip.on{background:var(--brass);color:var(--brass-ink);box-shadow:none}
.field{width:100%;min-height:120px;border:0;border-radius:16px;padding:14px;font-size:18px;line-height:1.5;background:var(--panel);color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset;outline:none;resize:vertical}
.lab{font-weight:800;font-size:14px;color:var(--sub);margin:6px 0}

/* ---------- 貯金箱 ---------- */
.bal{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.bal .n{font-family:var(--num);font-weight:800;font-size:68px;line-height:1;color:var(--brass)}
.bal .y{font-weight:800;font-size:22px}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs button{flex:1;border:0;border-radius:12px;padding:10px 2px;font-weight:800;font-size:12px;background:transparent;box-shadow:0 0 0 1.5px var(--line) inset;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);box-shadow:none}
.help{font-size:13px;line-height:1.5;color:var(--sub);margin:0 0 10px}
.item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--panel);box-shadow:0 0 0 1.5px var(--line) inset;margin-bottom:8px;cursor:pointer}
.item.sel{box-shadow:0 0 0 3px var(--brass) inset;background:color-mix(in srgb,var(--brass) 14%,var(--panel))}
.item .c{flex:none;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:800;font-size:22px;color:#2b3942;
  background:radial-gradient(circle at 30% 25%,#fafbfc,#c9d0d6 60%,#97a1a9);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.item .c.f{background:repeating-linear-gradient(45deg,#d8d2cf 0 6px,#cbc4c0 6px 12px);color:#8a7f7a;font-size:13px}
.item .t{flex:1;min-width:0}
.item .t p{margin:0;font-weight:700;font-size:16px;line-height:1.35;word-break:break-word}
.item .t small{display:block;margin-top:3px;color:var(--sub);font-size:12px}
.item .t small s{opacity:.7}
.batch{border-radius:16px;background:var(--panel);box-shadow:0 0 0 1.5px var(--line) inset;margin-bottom:10px;padding:4px 12px}
.batch summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-weight:800;cursor:pointer}
.batch summary::-webkit-details-marker{display:none}
.batch summary .n{font-family:var(--num);font-size:26px;color:var(--brass)}
.batch .row{padding:8px 0;border-top:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:10px}
.empty{text-align:center;color:var(--sub);padding:40px 10px;line-height:1.7}
.selbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));padding:0 14px;display:flex;justify-content:center;pointer-events:none}
.selbar .in{pointer-events:auto;width:min(100%,560px);display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:18px;background:var(--ink);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.selbar .in span{flex:1;font-weight:800;font-size:14px;line-height:1.3}
.selbar .in span b{font-family:var(--num);font-size:24px;color:var(--brass)}
.tools{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.tools p{flex-basis:100%;margin:0 0 4px;font-size:12.5px;color:var(--sub);line-height:1.5}

/* ---------- モーダル/トースト ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:14px;z-index:20}
.sheet{width:min(100%,520px);background:var(--panel);border-radius:24px;padding:22px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-size:19px}
.sheet .tot{font-family:var(--num);font-weight:800;font-size:60px;line-height:1;color:var(--brass)}
.sheet label{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.5;font-weight:700}
.sheet input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--red)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + var(--edge) + 52px);transform:translate(-50%,-30px);opacity:0;visibility:hidden;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;transition:transform .3s,opacity .3s,visibility 0s linear .3s;z-index:30;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .3s,opacity .3s,visibility 0s}
@media (prefers-reduced-motion:reduce){.card{transition-duration:.01s}.tear .l,.tear .r,.drop{animation-duration:.01s}}
</style>
</head>
<body>
<div id="app"></div>
<div id="nav" class="hide"></div>
<div id="day"></div>
<div id="toast"></div>

<script>
/* ===== データ ===== */
const KEY='coinNote.v1';
const blank=()=>({coins:[],batches:[],run:null,draft:'',day:null,days:[]});
let S=load();
if(!Array.isArray(S.days))S.days=[];
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&Array.isArray(j.coins))return Object.assign(blank(),j)}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('保存に失敗したで。バックアップ取っといて！')}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ===== ユーティリティ ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const fmt=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const hm=t=>{const d=new Date(t);return `${p2(d.getHours())}:${p2(d.getMinutes())}`};
const dur=(a,b)=>{const m=Math.max(0,Math.round((b-a)/60000));return m<60?`${m}分`:`${Math.floor(m/60)}時間${m%60}分`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
const avail=()=>S.coins.filter(c=>c.status==='saved'&&!c.batchId).sort((a,b)=>b.endedAt-a.endedAt);
const balance=()=>avail().reduce((s,c)=>s+c.amount,0);
const paper=(t,a)=>`<div class="mini"><div class="amtline"><span class="n">${a}</span><span class="y">円</span></div><div class="ptxt">${esc(t)}</div></div>`;

/* ===== 本日のラウンド(タスクとは独立・並行) ===== */
const MULT=[100,50,20],HOLD=[20,10,5];
const PRAISE=['逃げたくなる気持ちをばっちりコントロールできたな！今日のあんた、ほんまに立派やで！','一回転んでも、ちゃんと立ち上がってやり切った。立て直せる人は強いで！','逃げたかもしれんけど、諦めずにようやった！胸張ってええで！'];
const dkey=()=>{const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
function day(){
  const k=dkey();
  if(!S.day||S.day.date!==k){
    if(S.day&&S.day.rounds.length){const l=S.day.rounds[S.day.rounds.length-1];if(!l.endedAt){
      const [y,m,d]=S.day.date.split('-').map(Number);l.endedAt=new Date(y,m-1,d,23,59,59).getTime();l.result='auto';if(l.paused){const q=(l.pauses||[])[l.pauses.length-1];if(q&&!q.e)q.e=l.endedAt;l.paused=false}
      const amt=settle(l);setTimeout(()=>toast(`昨日のラウンドは自動で締めたで（${amt}円）`),400);
    }
    S.days.push(S.day)}
    S.day={date:k,rounds:[],over:false};save();
  }
  return S.day;
}
const cur=()=>{const r=day().rounds,l=r[r.length-1];return l&&!l.endedAt?l:null};
function rDay(){
  const el=$('#day');if(!el)return;
  const D=day(),a=cur(),n=D.rounds.length+1,live=!!a&&!a.paused;
  document.body.classList.toggle('live',live);
  el.className=live?'live':(a?'rest':'');
  let r1,msg;
  if(live){r1=`<span class="dl">R${a.no}　○<b>${a.held}</b>　✕<b>${a.slipped}</b>/3</span><button class="btn sm brass" data-act="reach">手が伸びた</button><button class="btn sm ghost" data-act="rpause">中断</button><button class="btn sm ghost" data-act="rclose">締める</button>`;msg='🔥 挑戦中｜逃げへんって決めた時間や';}
  else if(a){r1=`<span class="dl">R${a.no}　中断中</span><button class="btn sm brass" data-act="rresume">再開する</button><button class="btn sm ghost" data-act="rclose">締める</button>`;msg='中断中。戻ったら「再開する」を押してな';}
  else if(D.over||D.rounds.length>=3){r1=`<span class="dl">今日のラウンドは終了</span>`;msg='おつかれさん。明日また始めよか';}
  else{r1=`<span class="dl">今日のラウンド</span><button class="btn sm brass" data-act="rstart">ラウンド${n} 開始</button>`;msg='始める時は「開始」を押してな';}
  el.innerHTML=`<div class="r1">${r1}</div><div class="msg">${msg}</div>`;
}
setInterval(()=>rDay(),60000);
function refresh(){rDay();if(screen==='bank'||screen==='note')render()}
function sheet(html,setup){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet">${html}</div>`;document.body.appendChild(m);setup(m)}
let rPrev='note';
function settle(a){
  const amt=MULT[a.no-1];a.paid=amt;const t=a.endedAt;
  S.coins.push({id:uid(),text:`ラウンド${a.no}（自動で締め）`,origText:'',amount:amt,status:'saved',kind:'round',meta:`手が伸びた${a.held+a.slipped}回（○${a.held} ✕${a.slipped}）`,startedAt:t,endedAt:t,batchId:null});
  return amt;
}
function reach(){
  const a=cur();if(!a||a.paused)return;
  sheet(`<h3>手が伸びた。まず1呼吸。どうした？</h3><button class="btn brass" id="h">踏みとどまった</button><button class="btn ghost" id="s">見ちゃった</button><button class="btn ghost" id="c">間違えて押した</button>`,m=>{
    m.querySelector('#h').onclick=()=>{m.remove();hold()};
    m.querySelector('#s').onclick=()=>{m.remove();slip()};
    m.querySelector('#c').onclick=()=>m.remove();
  });
}
function hold(){
  const a=cur(),t=Date.now();a.held++;a.ev.push({k:'h',t});
  save();refresh();toast(`踏みとどまった（○${a.held}）`);
}
function slip(){
  const a=cur(),t=Date.now();a.slipped++;a.ev.push({k:'s',t});a.lastSlip=t;save();
  if(a.slipped<3){refresh();toast(`見ちゃった（${a.slipped}/3）。戻ってこれたらそれでええ`);return}
  a.endedAt=t;a.result='fail';a.paid=0;a.lastSlip=null;const n=a.no;
  if(n>=3)day().over=true;
  save();refresh();
  if(n<3)sheet(`<h3>3回見ちゃった</h3><div>ラウンド${n}はここまで（入金なし）。<br>ラウンド${n+1}いく？</div><button class="btn brass" id="y">いく（上の「開始」で始める）</button><button class="btn ghost" id="e">今日は終わり</button>`,m=>{
    m.querySelector('#y').onclick=()=>m.remove();
    m.querySelector('#e').onclick=()=>{m.remove();day().over=true;save();refresh()};
  });

/* ---- 貯金箱 ---- */
function rangeIds(){
  const list=avail();if(!sel.a)return[];
  const ia=list.findIndex(c=>c.id===sel.a);if(ia<0)return[];
  const ib=sel.b?list.findIndex(c=>c.id===sel.b):ia;
  const [lo,hi]=[Math.min(ia,ib<0?ia:ib),Math.max(ia,ib<0?ia:ib)];
  return list.slice(lo,hi+1).map(c=>c.id);
}
function itemHTML(c,selected){
  const edited=c.origText&&c.origText!==c.text;
  return `<div class="item ${selected?'sel':''}" data-act="pick" data-id="${c.id}">
  <div class="c ${c.status==='failed'?'f':''}">${c.status==='failed'?'ダメ':c.amount}</div>
  <div class="t"><p>${esc(c.text)}</p><small>${c.kind?fmt(c.startedAt)+(c.meta?'<br>'+esc(c.meta):''):`${fmt(c.startedAt)} → ${hm(c.endedAt)}（${dur(c.startedAt,c.endedAt)}）`}${edited?`<br><s>元: ${esc(c.origText)}</s>`:''}</small></div></div>`;
}
function rBank(app){
  const list=avail(),ids=new Set(rangeIds());
  const used=S.batches.slice().sort((a,b)=>b.at-a.at);
  const failed=S.coins.filter(c=>c.status==='failed').sort((a,b)=>b.endedAt-a.endedAt);
  let body='';
  if(tab==='avail'){
    body=list.length?`<p class="help">使う範囲は、最初の1枚→最後の1枚の順にタップ。間の分がまとめて選ばれるで。</p>`+list.map(c=>itemHTML(c,ids.has(c.id))).join('')
      :`<div class="empty">まだ使える小銭はないで。<br>付箋で1枚やりきって貯めよう。</div>`;
  }else if(tab==='used'){
    body=used.length?used.map(b=>{const cs=S.coins.filter(c=>c.batchId===b.id);
      return `<details class="batch"><summary><span>${fmt(b.at)} に使った（${cs.length}枚）</span><span class="n">${b.total}円</span></summary>${cs.map(c=>`<div class="row"><span>${esc(c.text)}</span><b>${c.amount}円</b></div>`).join('')}</details>`}).join('')
      :`<div class="empty">まだ権利を使ってへんで。</div>`;
  }else if(tab==='failed'){
    body=failed.length?failed.map(c=>itemHTML(c,false).replace('data-act="pick"','')).join(''):`<div class="empty">ダメやった挑戦はまだないで。</div>`;
  }else{
    const lab={done:'締めた',fail:'3回見た',auto:'自動で締め',lapsed:'未締め'};
    const ds=[S.day,...S.days.slice().reverse()].filter(d=>d&&d.rounds.length);
    body=ds.length?ds.map(d=>`<details class="batch"><summary><span>${d.date}</span><span class="n">${d.rounds.length}R</span></summary>${d.rounds.map(x=>{
      const bs=x.ev.filter(e=>e.k==='b').map(e=>e.m+'分').join('・');
      return `<div class="row"><span>R${x.no}　手が伸びた${x.held+x.slipped}回（○${x.held} ✕${x.slipped}）${x.pauses&&x.pauses.length?`　中断${x.pauses.length}回`:''}${bs?`<br><small>戻るまで: ${bs}</small>`:''}${x.reason?`<br><small>${esc(x.reason)}</small>`:''}</span><b>${x.endedAt?(lab[x.result]||'')+(x.paid!=null?' '+x.paid+'円':''):'進行中'}</b></div>`}).join('')}</details>`).join('')
      :`<div class="empty">まだラウンド記録はないで。</div>`;
  }
  const total=list.filter(c=>ids.has(c.id)).reduce((s,c)=>s+c.amount,0);
  app.innerHTML=`<div class="page"><div class="meta" style="margin:0">使える残高</div><div class="bal"><span class="n">${balance()}</span><span class="y">円</span></div>
  <div class="tabs"><button class="${tab==='avail'?'on':''}" data-act="tab" data-v="avail">使える(${list.length})</button><button class="${tab==='used'?'on':''}" data-act="tab" data-v="used">使った(${S.batches.length})</button><button class="${tab==='failed'?'on':''}" data-act="tab" data-v="failed">ダメやった(${failed.length})</button><button class="${tab==='rounds'?'on':''}" data-act="tab" data-v="rounds">ラウンド</button></div>
  ${body}
  <div class="tools"><p>データはこの端末のブラウザに保存してる。たまにバックアップ書き出しとくと安心やで。</p>
  <button class="btn sm ghost" data-act="export">バックアップ書き出し</button><button class="btn sm ghost" data-act="import">読み込み</button><input type="file" id="file" accept="application/json" hidden></div></div>
  ${tab==='avail'&&ids.size?`<div class="selbar"><div class="in"><span>${ids.size}枚選択<br><b>${total}</b>円</span><button class="btn sm ghost" data-act="all" style="color:var(--bg);box-shadow:0 0 0 2px rgba(255,255,255,.3) inset">全部</button><button class="btn sm ghost" data-act="clear" style="color:var(--bg);box-shadow:0 0 0 2px rgba(255,255,255,.3) inset">解除</button><button class="btn sm brass" data-act="spend">使う</button></div></div>`:''}`;
  const f=$('#file');if(f)f.onchange=doImport;
}

/* ===== 操作 ===== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='rstart'){const D=day();if(D.over||cur()||D.rounds.length>=3)return;D.rounds.push({no:D.rounds.length+1,startedAt:Date.now(),endedAt:null,held:0,slipped:0,ev:[],paused:false,pauses:[]});save();refresh();toast(`ラウンド${D.rounds.length}、開始！`)}
  else if(a==='rpause'){const x=cur();if(!x||x.paused)return;x.pauses=x.pauses||[];x.paused=true;x.pauses.push({s:Date.now(),e:null});save();refresh();toast('中断中。戻ったら「再開する」を押してな')}
  else if(a==='rresume'){const x=cur();if(!x||!x.paused)return;const q=(x.pauses||[])[x.pauses.length-1];if(q&&!q.e)q.e=Date.now();x.paused=false;save();refresh();toast('再開！ここから逃げへん時間や')}
  else if(a==='reach')reach();
  else if(a==='rclose'){const x=cur();if(!x)return;if(screen!=='redit')rPrev=screen;pickAmt=MULT[x.no-1];screen='redit';render();upPrev()}
  else if(a==='rback'){screen=rPrev;render()}
  else if(a==='rdeposit'){
    const x=cur();if(!x){screen=rPrev;render();return}
    const reason=$('#etxt').value.trim(),t=Date.now();
    x.endedAt=t;x.result='done';if(x.paused){const q=(x.pauses||[])[x.pauses.length-1];if(q&&!q.e)q.e=t;x.paused=false}x.paid=pickAmt;x.reason=reason;day().over=true;
    S.coins.push({id:uid(),text:reason||`ラウンド${x.no}を締めた`,origText:'',amount:pickAmt,status:'saved',kind:'round',meta:`ラウンド${x.no}　手が伸びた${x.held+x.slipped}回（○${x.held} ✕${x.slipped}）`,startedAt:t,endedAt:t,batchId:null});
    save();screen=rPrev;render();toast(`${pickAmt}円、貯金箱に入ったで！`);
  }
  else if(a==='go-note'){screen='note';render()}
  else if(a==='go-bank'){screen='bank';render()}
  else if(a==='edit'){editing=true;drawZone()}
  else if(a==='start'){if(!S.draft.trim())return;S.run={text:S.draft.trim(),amount:100,startedAt:Date.now(),endedAt:null};save();screen='run';render()}
  else if(a==='stop'){S.run.endedAt=Date.now();save();screen='judge';render()}
  else if(a==='to-edit'){pickAmt=S.run.amount||100;screen='edit';render();upPrev()}
  else if(a==='back-judge'){screen='judge';render()}
  else if(a==='amt'){pickAmt=+el.dataset.v;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',+c.dataset.v===pickAmt));upPrev()}
  else if(a==='deposit')deposit();
  else if(a==='tear')tear();
  else if(a==='tab'){tab=el.dataset.v;sel={a:null,b:null};render()}
  else if(a==='pick'){pick(el.dataset.id)}
  else if(a==='all'){const l=avail();if(l.length){sel={a:l[0].id,b:l[l.length-1].id};render()}}
  else if(a==='clear'){sel={a:null,b:null};render()}
  else if(a==='spend')spendModal();
  else if(a==='export')doExport();
  else if(a==='import')$('#file').click();
});
document.addEventListener('input',e=>{if(e.target.id==='etxt')upPrev()});
function upPrev(){const p=$('#prev');if(!p||(screen!=='edit'&&screen!=='redit'))return;const t=$('#etxt');const x=cur();p.innerHTML=paper(screen==='edit'?(t?t.value:S.run.text):((t&&t.value.trim())||`ラウンド${x?x.no:''}`),pickAmt)}

function pick(id){
  if(!sel.a||sel.b){sel={a:id,b:null}}else{sel.b=id}
  const y=$('.page').scrollTop;render();$('.page').scrollTop=y;
}
function deposit(){
  const text=$('#etxt').value.trim();if(!text){toast('やったことを書いてな');return}
  const r=S.run;
  S.coins.push({id:uid(),text,origText:r.text,amount:pickAmt,status:'saved',startedAt:r.startedAt,endedAt:r.endedAt,batchId:null});
  S.run=null;S.draft='';save();
  const p=$('#prev');if(p)p.firstElementChild.classList.add('drop');
  setTimeout(()=>{tab='avail';sel={a:null,b:null};screen='bank';render();toast(`${pickAmt}円、貯金箱に入ったで！`)},650);
}
function tear(){
  const r=S.run;
  S.coins.push({id:uid(),text:r.text,origText:r.text,amount:r.amount||100,status:'failed',startedAt:r.startedAt,endedAt:r.endedAt,batchId:null});
  S.run=null;S.draft='';save();
  const html=paper(r.text,r.amount||100);
  $('#prev').innerHTML=`<div class="tear"><div class="half l">${html}</div><div class="half r">${html}</div></div>`;
  setTimeout(()=>{tab='failed';sel={a:null,b:null};screen='bank';render();toast('ちぎった。次はいけるで')},900);
}
function spendModal(){
  const ids=rangeIds();const cs=S.coins.filter(c=>ids.includes(c.id));const total=cs.reduce((s,c)=>s+c.amount,0);
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="sheet"><h3>この小銭の権利、ほんまに使う？</h3><div class="tot">${total}円</div>
  <div style="color:var(--sub);font-size:14px">${cs.length}枚分（${fmt(Math.min(...cs.map(c=>c.endedAt)))} 〜 ${fmt(Math.max(...cs.map(c=>c.endedAt)))}）</div>
  <label><input type="checkbox" id="ok"><span>一回使ったら元に戻せへんことを分かってる</span></label>
  <button class="btn red" id="go" disabled>${total}円分を使う</button><button class="btn ghost" id="no">やめとく</button></div>`;
  document.body.appendChild(m);
  m.querySelector('#ok').onchange=e=>m.querySelector('#go').disabled=!e.target.checked;
  m.querySelector('#no').onclick=()=>m.remove();
  m.onclick=e=>{if(e.target===m)m.remove()};
  m.querySelector('#go').onclick=()=>{
    const b={id:uid(),at:Date.now(),total,coinIds:ids};
    S.batches.push(b);S.coins.forEach(c=>{if(ids.includes(c.id))c.batchId=b.id});
    save();sel={a:null,b:null};tab='used';m.remove();render();toast(`${total}円分、使ったで！`);
  };
}
function doExport(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const d=new Date();a.download=`coin-note-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function doImport(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);if(!j||!Array.isArray(j.coins))throw 0;
    if(!confirm('今のデータをこのバックアップで丸ごと置き換えるで。ええ？'))return;
    S=Object.assign(blank(),j);save();screen=S.run?(S.run.endedAt?'judge':'run'):'note';render();toast('読み込んだで！');
  }catch(err){toast('このファイルは読み込めへんかった')}};
  r.readAsText(f);
}

render();
</script>
